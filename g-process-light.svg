<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="How I work: understand, design the system, build it properly, ship and refine"><title>How I work: understand, design the system, build it properly, ship and refine</title><defs><style>@font-face{font-family:'BG';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
