<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="Life RPG: Turns real-life tasks into an RPG: complete quests, earn XP and gold, level up and keep daily streaks."><title>Life RPG: Turns real-life tasks into an RPG: complete quests, earn XP and gold, level up and keep daily streaks.</title><defs><style>@font-face{font-family:'BG';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,26px)}}
@keyframes dr2{to{transform:translate(-80px,-22px)}}
@keyframes dr3{to{transform:translate(40px,-30px)}}
.pulse{animation:pl 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
