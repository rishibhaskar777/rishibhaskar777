<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-label="Shastra"><title>Shastra</title><defs><style>@font-face{font-family:'BG';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
