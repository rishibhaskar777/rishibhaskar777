<svg xmlns="http://www.w3.org/2000/svg" width="123" height="40" viewBox="0 0 123 40" role="img" aria-label="LinkedIn"><title>LinkedIn</title><defs><style>@font-face{font-family:'BG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,26px)}}
@keyframes dr2{to{transform:translate(-80px,-22px)}}
@keyframes dr3{to{transform:translate(40px,-30px)}}
.pulse{animation:pl 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.blink{animation:bk 1.05s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.drift1,.drift2,.drift3,.pulse,.blink{animation:none}}
</style><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.1"/><stop offset="1" stop-color="#22c3d6" stop-opacity="0.1"/></linearGradient></defs><rect x=".75" y=".75" width="121.5" height="38.5" rx="20.0" fill="#f5f6fb"/><rect x=".75" y=".75" width="121.5" height="38.5" rx="20.0" fill="url(#g1)" stroke="#15131f" stroke-opacity="0.1"/><rect x="16" y="11" width="18" height="18" rx="4" fill="#0A66C2"/><text x="25" y="24.5" font-family="'BG', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="800" font-size="11" fill="#f5f6fb" text-anchor="middle">in</text><text x="44.0" y="25.5" font-family="'BG', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" fill="#15131f" text-anchor="start" >LinkedIn</text></svg>