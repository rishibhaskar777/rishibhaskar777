<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rishi Bhaskar — I design it. Then I build it.">
  <title>Rishi Bhaskar — I design it. Then I build it.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2b2a36"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff7a59" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .draw { stroke-dasharray: 1300; stroke-dashoffset: 1300; animation: draw 1.6s ease-out 0.2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .fade { opacity: 0; animation: fade 0.6s ease-out 1.4s forwards; }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="320" rx="16" fill="#0e0e14"/>
  <rect width="1200" height="320" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- frame label, like a design-tool canvas -->
  <text x="330" y="86" class="mono" font-size="14" fill="#8a879c">frame / rishi-bhaskar</text>

  <!-- selection box drawn around the name -->
  <rect class="draw" x="330" y="98" width="540" height="112" fill="none" stroke="#ff7a59" stroke-width="1.5"/>
  <g class="fade" fill="#0e0e14" stroke="#ff7a59" stroke-width="1.5">
    <rect x="325" y="93" width="10" height="10"/>
    <rect x="865" y="93" width="10" height="10"/>
    <rect x="325" y="205" width="10" height="10"/>
    <rect x="865" y="205" width="10" height="10"/>
  </g>

  <!-- name -->
  <text x="600" y="176" text-anchor="middle" class="sans" font-size="64" font-weight="700"
        fill="#f4f1ec" textLength="456" lengthAdjust="spacingAndGlyphs">Rishi Bhaskar</text>

  <!-- dimension tag -->
  <g class="fade">
    <rect x="556" y="220" width="88" height="22" rx="4" fill="#ff7a59"/>
    <text x="600" y="235.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#0e0e14">540 × 112</text>
  </g>

  <!-- cursor pointer -->
  <path class="fade" d="M884 218 L884 246 L891 239 L896 251 L901 249 L896 237 L906 237 Z"
        fill="#f4f1ec" stroke="#0e0e14" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- tagline with blinking caret -->
  <text x="600" y="282" text-anchor="middle" class="sans" font-size="22" fill="#cfc9bd"
        textLength="300" lengthAdjust="spacingAndGlyphs">I design it. Then I build it.</text>
  <rect class="blink" x="756" y="264" width="2.5" height="24" fill="#ff7a59"/>

  <!-- small role line -->
  <text x="600" y="306" text-anchor="middle" class="mono" font-size="12" fill="#6f6c80" letter-spacing="1">frontend · ui/ux · full-stack in progress</text>
</svg>
