<svg xmlns="http://www.w3.org/2000/svg" width="101" height="40" viewBox="0 0 101 40" role="img" aria-label="Email"><title>Email</title><defs><style>@font-face{font-family:'BG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,26px)}}
@keyframes dr2{to{transform:translate(-80px,-22px)}}
@keyframes dr3{to{transform:translate(40px,-30px)}}
.pulse{animation:pl 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.blink{animation:bk 1.05s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.drift1,.drift2,.drift3,.pulse,.blink{animation:none}}
</style><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.16"/><stop offset="1" stop-color="#22c3d6" stop-opacity="0.12"/></linearGradient></defs><rect x=".75" y=".75" width="99.5" height="38.5" rx="20.0" fill="#0c0d17"/><rect x=".75" y=".75" width="99.5" height="38.5" rx="20.0" fill="url(#g1)" stroke="#fff" stroke-opacity="0.16"/><rect x="16" y="13" width="19" height="14" rx="3" fill="none" stroke="#ff9f85" stroke-width="1.6"/><path d="M17 15 L25.5 21 L34 15" fill="none" stroke="#ff9f85" stroke-width="1.6" stroke-linejoin="round"/><text x="44.0" y="25.5" font-family="'BG', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" fill="#eef0fb" text-anchor="start" >Email</text></svg>