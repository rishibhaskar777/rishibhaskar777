<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-label="Toolkit: HTML, CSS, JavaScript, TypeScript, React, Next.js, Tailwind CSS, Node.js, Express, MongoDB, Python, Vitest, GitHub Actions, Git"><title>Toolkit: HTML, CSS, JavaScript, TypeScript, React, Next.js, Tailwind CSS, Node.js, Express, MongoDB, Python, Vitest, GitHub Actions, Git</title><defs><style>@font-face{font-family:'BG';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,26px)}}
@keyframes dr2{to{transform:translate(-80px,-22px)}}
@keyframes dr3{to{transform:translate(40px,-30px)}}
