<svg xmlns="http://www.w3.org/2000/svg" width="97" height="40" viewBox="0 0 97 40" role="img" aria-label="India"><title>India</title><defs><style>@font-face{font-family:'BG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'BG';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
.drift1{animation:dr1 19s ease-in-out infinite alternate}
.drift2{animation:dr2 23s ease-in-out infinite alternate}
.drift3{animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(70px,26px)}}
@keyframes dr2{to{transform:translate(-80px,-22px)}}
@keyframes dr3{to{transform:translate(40px,-30px)}}
.pulse{animation:pl 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.blink{animation:bk 1.05s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.drift1,.drift2,.drift3,.pulse,.blink{animation:none}}
